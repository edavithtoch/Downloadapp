<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Video Downloader</title>
<style>
:root{--bg:#e6e9ef;--hi:#fff;--lo:#c3c8d2;--tx:#2b3240;--mu:#7b8494;--ac:#4f7cff;--ok:#22b573;--bad:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:460px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:8px 0 18px;text-align:center}
.page{display:none}.page.on{display:block}
.up{background:var(--bg);border-radius:24px;box-shadow:7px 7px 15px var(--lo),-7px -7px 15px var(--hi)}
.in{background:var(--bg);border-radius:16px;box-shadow:inset 4px 4px 9px var(--lo),inset -4px -4px 9px var(--hi)}
.card{padding:16px;margin-bottom:20px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:700}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--tx);font-size:15px;padding:13px 14px}
.field{flex:1;min-width:0;display:flex}
button{font:inherit;border:0;color:var(--tx);background:var(--bg);cursor:pointer;border-radius:16px;padding:12px 16px;font-weight:600;box-shadow:5px 5px 11px var(--lo),-5px -5px 11px var(--hi)}
button:active{box-shadow:inset 4px 4px 8px var(--lo),inset -4px -4px 8px var(--hi)}
.gear{padding:0 14px;color:var(--mu)}
.set{display:none;margin-top:12px}.set.on{display:block}.set .field{margin-bottom:10px}
.set small{color:var(--mu);display:block;margin:0 4px 10px;font-size:12px}
.err{color:var(--bad);font-size:14px;margin:10px 4px 0;min-height:0}
.center{text-align:center}
.ring{position:relative;width:200px;height:200px;margin:30px auto;border-radius:50%;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.trk{stroke:var(--lo);opacity:.5}.arc{stroke:var(--ac);transition:stroke-dashoffset .3s}
.pct{font-size:40px;font-weight:800}
.mu{color:var(--mu)}
.spin .arc{animation:sp 1.2s linear infinite;stroke-dasharray:80 250!important}
@keyframes sp{to{stroke-dashoffset:-330}}
.thumb{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:22px;display:block;background:var(--lo);margin:6px 0 20px;box-shadow:7px 7px 15px var(--lo),-7px -7px 15px var(--hi)}
.big{width:100%;padding:20px;font-size:18px;color:#fff;background:linear-gradient(135deg,#ff2d6f,#25d6e6);border-radius:22px;margin-bottom:16px;box-shadow:6px 6px 14px var(--lo),-6px -6px 14px var(--hi)}
.two{display:flex;gap:14px}.two button{flex:1}
</style></head><body><div class="wrap">
<h1>⬇️ Video Downloader</h1>

<section id="p1" class="page on">
 <div id="cards"></div>
 <p class="center mu" style="font-size:13px">Paste a link — it starts automatically.<br>Only save videos you have the right to.</p>
</section>

<section id="p2" class="page center">
 <h1 id="ptitle">Downloading…</h1>
 <div class="ring up" id="ring"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"/><circle class="arc" id="arc" cx="60" cy="60" r="52"/></svg><span class="pct" id="pct">0%</span></div>
 <p id="msg" class="mu">Starting…</p>
 <div class="two" style="margin-top:24px"><button id="cancel">Cancel</button><button id="retry" style="display:none;color:var(--ac)">↻ Retry</button></div>
</section>

<section id="p3" class="page">
 <h1>✅ Done</h1>
 <img id="thumb" class="thumb" alt="">
 <button class="big" id="share">Share to TikTok</button>
 <div class="two"><button id="save">💾 Save to device</button><button id="again">➕ Download another</button></div>
 <p id="fmsg" class="center mu" style="font-size:13px;margin-top:14px"></p>
</section>
</div>
<script>
const $=id=>document.getElementById(id), C=2*Math.PI*52;
const N=window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform();
const P=window.Capacitor&&Capacitor.Plugins||{}, FS=P.Filesystem, SH=P.Share;
const COBALT_LIST="https://instances.cobalt.best/api/instances.json";
const SRC={
 youtube:{n:"YouTube",c:"#ff0033",re:/youtu(\.be|be\.com)/i,ph:"Cobalt API URL (optional)",key:1,
  hint:"Leave empty to auto-use free public Cobalt servers. For best results, paste your own Cobalt URL + key."},
 facebook:{n:"Facebook",c:"#1877f2",re:/facebook\.com|fb\.watch|fb\.com/i,ph:"Cobalt API URL (optional)",key:1,
  hint:"Public videos only. Same Cobalt settings as YouTube."},
 tiktok:{n:"TikTok",c:"#111",re:/tiktok\.com/i,ph:"https://www.tikwm.com/api/",key:0,
  hint:"Free, no key needed. Change URL only if the API moves."}
};
const ls={g:k=>{try{return localStorage.getItem(k)||""}catch{return""}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const page=n=>[1,2,3].forEach(i=>$("p"+i).classList.toggle("on",i==n));
let run=0,last=null,res=null,blob=null,ctl=null;

/* ---- link page ---- */
Object.entries(SRC).forEach(([k,s])=>{
 const d=document.createElement("div");d.className="card up";
 d.innerHTML=`<div class="top"><span class="dot" style="background:${s.c}">${s.n[0]}</span>${s.n}</div>
 <div class="row"><div class="field in"><input id="u_${k}" type="url" placeholder="Paste ${s.n} link" autocomplete="off"></div>
 <button id="b_${k}">Paste</button><button class="gear" id="g_${k}" aria-label="API settings">⚙</button></div>
 <div class="err" id="e_${k}"></div>
 <div class="set in" style="padding:12px" id="s_${k}"><div class="field up"><input id="a_${k}" placeholder="${s.ph}" value="${ls.g("api_"+k)}"></div>
 ${s.key?`<div class="field up"><input id="k_${k}" type="password" placeholder="API key (optional)" value="${ls.g("key_"+k)}"></div>`:""}
 <small>${s.hint}</small></div>`;
 $("cards").appendChild(d);
 $("g_"+k).onclick=()=>$("s_"+k).classList.toggle("on");
 $("a_"+k).oninput=e=>ls.s("api_"+k,e.target.value.trim());
 if(s.key)$("k_"+k).oninput=e=>ls.s("key_"+k,e.target.value.trim());
 $("b_"+k).onclick=async()=>{try{$("u_"+k).value=(await navigator.clipboard.readText()).trim()}catch{$("e_"+k).textContent="Clipboard blocked — long-press the box and paste.";return}go(k)};
 $("u_"+k).addEventListener("paste",()=>setTimeout(()=>go(k),50));
 $("u_"+k).addEventListener("keydown",e=>{if(e.key=="Enter")go(k)});
});

function go(k){
 const u=$("u_"+k).value.trim(),e=$("e_"+k);e.textContent="";
 if(!/^https?:\/\//i.test(u)||!SRC[k].re.test(u)){e.textContent="Please paste a valid "+SRC[k].n+" link.";return}
 last={k,u};start();
}

/* ---- progress page ---- */
function prog(p,m,spin){$("ring").classList.toggle("spin",!!spin);$("arc").style.strokeDasharray=C;$("arc").style.strokeDashoffset=C*(1-p/100);$("pct").textContent=Math.round(p)+"%";if(m)$("msg").textContent=m}
async function start(){
 const id=++run;blob=null;res=null;ctl=new AbortController();
 $("ptitle").textContent="Downloading…";$("retry").style.display="none";$("cancel").style.display="";
 prog(0,"Finding your video…",1);page(2);
 try{
  res=await resolve(last.k,last.u,id);if(id!=run)return;
  prog(0,"Downloading…");
  await fetchFile(res,id);if(id!=run)return;
  $("thumb").src=res.thumb||"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250"><rect width="400" height="250" fill="#c3c8d2"/><text x="200" y="140" font-size="60" text-anchor="middle">🎬</text></svg>');
  $("fmsg").textContent="";page(3);
 }catch(e){if(id!=run)return;$("ptitle").textContent="Failed";$("ring").classList.remove("spin");$("msg").textContent=e.message||"Something went wrong.";$("retry").style.display="";$("cancel").textContent="Back"}
}
$("cancel").onclick=()=>{run++;ctl&&ctl.abort();$("cancel").textContent="Cancel";page(1)};
$("retry").onclick=()=>{$("cancel").textContent="Cancel";start()};
$("again").onclick=()=>{["youtube","facebook","tiktok"].forEach(k=>$("u_"+k).value="");page(1)};

/* ---- resolve link -> direct file url ---- */
async function resolve(k,u,id){
 if(k=="tiktok"){
  const api=ls.g("api_tiktok")||"https://www.tikwm.com/api/";
  const j=await(await fetch(api+(api.includes("?")?"&":"?")+"hd=1&url="+encodeURIComponent(u),{signal:ctl.signal})).json();
  const d=j.data;if(!d||!(d.hdplay||d.play))throw new Error("Video not found. Is the link public?");
  const f=x=>x&&x[0]=="/"?"https://www.tikwm.com"+x:x;
  return{url:f(d.hdplay||d.play),thumb:f(d.cover),name:"tiktok_"+Date.now()+".mp4"};
 }
 let bases=[];const a=ls.g("api_"+k),key=ls.g("key_"+k);
 if(a)bases.push([a.replace(/\/?$/,"/"),key]);
 else try{
  const l=await(await fetch(COBALT_LIST,{signal:ctl.signal})).json();
  l.sort((x,y)=>(y.score||0)-(x.score||0)).forEach(i=>{if(bases.length<6&&i.api&&(i.services||{})[k]in{true:1,"true":1})bases.push([(i.protocol||"https")+"://"+i.api+"/",""])});
 }catch{}
 if(!bases.length)throw new Error("No free server found. Open ⚙ and add a Cobalt API URL.");
 let last="";
 for(const[b,kk]of bases){
  if(id!=run)return;
  try{
   $("msg").textContent="Trying server "+(bases.findIndex(x=>x[0]==b)+1)+"/"+bases.length+"…";
   const h={Accept:"application/json","Content-Type":"application/json"};if(kk)h.Authorization="Api-Key "+kk;
   const j=await(await fetch(b,{method:"POST",headers:h,signal:ctl.signal,body:JSON.stringify({url:u,videoQuality:"720",youtubeVideoCodec:"h264"})})).json();
   if(["tunnel","redirect","stream"].includes(j.status)&&j.url){
    const m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);
    return{url:j.url,thumb:k=="youtube"&&m?"https://i.ytimg.com/vi/"+m[1]+"/hqdefault.jpg":"",name:j.filename||k+"_"+Date.now()+".mp4"};
   }
   last=(j.error&&j.error.code)||j.status||"";
  }catch(e){if(e.name=="AbortError")throw e;last=e.message}
 }
 throw new Error("All servers failed"+(last?" ("+String(last).slice(0,60)+")":"")+". Add your own Cobalt URL/key in ⚙, or retry.");
}

/* ---- download ---- */
async function fetchFile(r,id){
 r.name=r.name.replace(/[^\w.\-]+/g,"_");
 if(N&&FS){
  const l=await FS.addListener("progress",e=>{if(id==run&&e.contentLength)prog(e.bytes/e.contentLength*100)});
  try{
   const o=await FS.downloadFile({url:r.url,path:r.name,directory:"DOCUMENTS",progress:true,recursive:true});
   r.path=o.path;r.uri=(await FS.getUri({path:r.name,directory:"DOCUMENTS"})).uri;
  }finally{l.remove()}
  return;
 }
 const x=await fetch(r.url,{signal:ctl.signal});if(!x.ok)throw new Error("Download failed ("+x.status+")");
 const tot=+x.headers.get("content-length")||0,rd=x.body.getReader(),parts=[];let got=0;
 for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;if(tot)prog(got/tot*100,null,0);else prog(0,"Downloading… "+(got/1e6).toFixed(1)+" MB",1)}
 blob=new Blob(parts,{type:"video/mp4"});
}

/* ---- done page ---- */
function webSave(){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=res.name;a.click()}
$("save").onclick=async()=>{
 try{
  if(N&&FS){
   if(Capacitor.getPlatform()=="ios")await SH.share({files:[res.uri]});
   else $("fmsg").textContent="Saved in Documents: "+res.name;
  }else{webSave();$("fmsg").textContent="Saved."}
 }catch{}
};
$("share").onclick=async()=>{
 try{
  if(N&&SH)await SH.share({title:"Video",files:[res.uri]});
  else if(blob&&navigator.canShare&&navigator.canShare({files:[new File([blob],res.name,{type:"video/mp4"})]}))await navigator.share({files:[new File([blob],res.name,{type:"video/mp4"})]});
  else{webSave();$("fmsg").textContent="Saved. Now open TikTok and upload it."}
 }catch{}
};
</script></body></html>
